/* =============================================================================
   IEB External Advisors — Design System
   Colors + Typography Foundations
   -----------------------------------------------------------------------------
   Source of truth: "IEB External Advisors Design System" (Key Visual 2026).
   Strict 60/30/10: Black/White dominant + secondary, accent in Azul IEB
   (#404EFF, interactive/CTA) and Celeste (#00A6FB, editorial emphasis on
   keywords + numbers). No yellow. Flat, minimal, generous whitespace.
   Typeface: Poly Sans — hierarchy by SIZE, restraint in weight.
   ============================================================================= */

/* ---------- FONTS ----------------------------------------------------------- */
/* Poly Sans (Pangram Pangram) — the brand's official typeface, loaded from     */
/* local trial files in /fonts. Slim (300) → Neutral (400) → Median (500) →     */
/* Bulky (700). Display leans on Slim/Median; body on Neutral; Mono for data.   */

@font-face { font-family: 'Poly Sans'; src: url('assets/fonts/polysanstrial-slim.woff2') format('woff2'), url('assets/fonts/polysanstrial-slim.otf') format('opentype');         font-weight: 300; font-style: normal; font-display: swap; }
@font-face { font-family: 'Poly Sans'; src: url('assets/fonts/polysanstrial-neutral.woff2') format('woff2'), url('assets/fonts/polysanstrial-neutral.otf') format('opentype');   font-weight: 400; font-style: normal; font-display: swap; }
@font-face { font-family: 'Poly Sans'; src: url('assets/fonts/polysanstrial-median.woff2') format('woff2'), url('assets/fonts/polysanstrial-median.otf') format('opentype');     font-weight: 500; font-style: normal; font-display: swap; }
@font-face { font-family: 'Poly Sans'; src: url('assets/fonts/polysanstrial-bulky.woff2') format('woff2'), url('assets/fonts/polysanstrial-bulky.otf') format('opentype');       font-weight: 700; font-style: normal; font-display: swap; }

/* Mono — tabular numerals, eyebrows, data micro-copy */
@font-face { font-family: 'Poly Sans Mono'; src: url('assets/fonts/polysanstrial-slimmono.woff2') format('woff2'), url('assets/fonts/polysanstrial-slimmono.otf') format('opentype');     font-weight: 300; font-style: normal; font-display: swap; }
@font-face { font-family: 'Poly Sans Mono'; src: url('assets/fonts/polysanstrial-medianmono.woff2') format('woff2'), url('assets/fonts/polysanstrial-medianmono.otf') format('opentype'); font-weight: 500; font-style: normal; font-display: swap; }

:root {
  /* =========================================================================
     COLOR — Key Visual 2026 palette
     ========================================================================= */

  /* — Core — */
  --ieb-black:   #000000;
  --ieb-white:   #ffffff;
  --ieb-blue:    #404eff;   /* Azul IEB — interactive / CTA (used sparingly) */
  --ieb-cyan:    #00a6fb;   /* Celeste — primary activator: keywords + numbers */

  /* — Accent tints (hover/press, translucent fills) — */
  --ieb-blue-hover:  #2f3ce6;
  --ieb-blue-press:  #2531c4;
  --ieb-cyan-soft:   rgba(0,166,251,0.12);
  --ieb-blue-soft:   rgba(64,78,255,0.10);

  /* — Neutral scale — */
  --gray-950: #0a0a0c;
  --gray-900: #111114;
  --gray-800: #1a1a1f;
  --gray-700: #3d3d44;
  --gray-500: #75757e;
  --gray-400: #9a9aa2;
  --gray-300: #c7c7cf;
  --gray-100: #eeeef1;
  --gray-50:  #f7f7f9;

  /* =========================================================================
     SEMANTIC ROLES
     ========================================================================= */

  /* Surfaces — white-led by default ("siempre sobre blanco"), black for bookends */
  --surface-page:      var(--ieb-white);
  --surface-dark:      var(--ieb-black);
  --surface-muted:     var(--gray-50);
  --surface-card:      var(--ieb-white);
  --surface-card-dark: var(--gray-950);

  /* Text */
  --fg-1:            var(--ieb-black);            /* primary on light */
  --fg-2:            var(--gray-500);             /* secondary on light */
  --fg-3:            var(--gray-400);             /* muted on light */
  --fg-on-dark-1:    var(--ieb-white);
  --fg-on-dark-2:    var(--gray-300);
  --fg-on-dark-3:    var(--gray-500);

  /* Accent roles */
  --accent:          var(--ieb-cyan);            /* editorial emphasis */
  --accent-strong:   var(--ieb-blue);            /* CTA / interactive */
  --accent-ink:      var(--ieb-white);           /* text on --accent-strong */
  --focus-ring:      var(--ieb-cyan);

  /* Borders / hairlines */
  --border-subtle:   var(--gray-100);
  --border-default:  var(--gray-300);
  --border-on-dark:  rgba(255,255,255,0.14);

  /* =========================================================================
     ELEVATION / RADII / SPACING / MOTION
     ========================================================================= */

  /* Flat brand — shadows only for genuine UI elevation, kept subtle. */
  --shadow-sm: 0 1px 2px rgba(0,0,0,.06);
  --shadow-md: 0 4px 16px rgba(0,0,0,.08);
  --shadow-lg: 0 12px 32px rgba(0,0,0,.12);
  --shadow-on-dark: 0 20px 48px rgba(0,0,0,.5);

  --radius-sm:   4px;
  --radius-md:   8px;
  --radius-lg:   16px;
  --radius-xl:   24px;
  --radius-pill: 999px;   /* reserved for numeric / keyword callouts */

  --space-1:  4px;   --space-2:  8px;   --space-3:  12px;  --space-4:  16px;
  --space-5:  20px;  --space-6:  24px;  --space-8:  32px;  --space-10: 40px;
  --space-12: 48px;  --space-14: 56px;  --space-16: 64px;  --space-20: 80px;
  --space-24: 96px;  --space-32: 128px;

  --container-max: 1160px;

  --ease-standard: cubic-bezier(.4,0,.2,1);
  --t-quick:    .12s var(--ease-standard);
  --t-standard: .2s  var(--ease-standard);
  --t-smooth:   .36s var(--ease-standard);

  /* =========================================================================
     TYPOGRAPHY — smaller, lighter than before (team: "todo demasiado grande")
     ========================================================================= */

  --font-sans:    'Poly Sans', system-ui, -apple-system, sans-serif;
  --font-display: 'Poly Sans', system-ui, -apple-system, sans-serif;
  --font-body:    'Poly Sans', system-ui, -apple-system, sans-serif;
  --font-mono:    'Poly Sans Mono', ui-monospace, 'SF Mono', monospace;

  /* Type scale — restrained. Hero maxes ~56px, section openers ~40px. */
  --fs-display-xl: clamp(2.75rem, 5.2vw, 4rem);    /* 44 → 64px  (rare, brand statement) */
  --fs-display-lg: clamp(2.25rem, 4.2vw, 3.5rem);  /* 36 → 56px  (hero h1) */
  --fs-display-md: clamp(1.75rem, 3vw, 2.5rem);    /* 28 → 40px  (section opener) */
  --fs-h2:   clamp(1.5rem, 2.4vw, 2rem);           /* 24 → 32px */
  --fs-h3:   1.25rem;                              /* 20px */
  --fs-h4:   1.0625rem;                            /* 17px */
  --fs-body-lg:  1.125rem;   /* 18px */
  --fs-body:     1rem;       /* 16px */
  --fs-body-sm:  0.875rem;   /* 14px */
  --fs-caption:  0.8125rem;  /* 13px */
  --fs-eyebrow:  0.6875rem;  /* 11px */

  --fw-light:   300;
  --fw-regular: 400;
  --fw-medium:  500;
  --fw-bold:    700;

  --lh-tight:  1.05;
  --lh-snug:   1.14;
  --lh-normal: 1.35;
  --lh-body:   1.6;

  --tr-tight:  -0.02em;
  --tr-snug:   -0.01em;
  --tr-normal: 0;
  --tr-wide:   0.08em;    /* eyebrows, tags */
  --tr-xwide:  0.16em;
}

/* =========================================================================
   BASE ELEMENT STYLES
   ========================================================================= */

html, body {
  font-family: var(--font-body);
  font-size: var(--fs-body);
  line-height: var(--lh-body);
  color: var(--fg-1);
  background: var(--surface-page);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

h1, .h1, h2, .h2, h3, .h3, h4, .h4,
.display-xl, .display-lg, .display-md {
  font-family: var(--font-display);
  font-weight: var(--fw-medium);       /* Median, not Bulky — lighter, cleaner */
  letter-spacing: var(--tr-tight);
  line-height: var(--lh-snug);
  text-wrap: balance;
  margin: 0;
}

.display-xl { font-size: var(--fs-display-xl); line-height: var(--lh-tight); }
.display-lg { font-size: var(--fs-display-lg); line-height: var(--lh-tight); }
.display-md { font-size: var(--fs-display-md); line-height: var(--lh-tight); }

h2, .h2 { font-size: var(--fs-h2); }
h3, .h3 { font-size: var(--fs-h3); letter-spacing: var(--tr-snug); }
h4, .h4 { font-size: var(--fs-h4); letter-spacing: var(--tr-snug); }

p        { margin: 0; }
.body-lg { font-size: var(--fs-body-lg); line-height: var(--lh-body); }
.body-sm { font-size: var(--fs-body-sm); line-height: var(--lh-body); }
.caption { font-size: var(--fs-caption); line-height: var(--lh-normal); }

/* Signature eyebrow — uppercase, wide tracking, mono, cyan (or gray if subdued) */
.eyebrow {
  font-family: var(--font-mono);
  font-size: var(--fs-eyebrow);
  font-weight: var(--fw-medium);
  letter-spacing: var(--tr-xwide);
  text-transform: uppercase;
  color: var(--accent);
}
.eyebrow--gray { color: var(--fg-2); }

code, pre, .mono { font-family: var(--font-mono); font-size: 0.92em; }

a { color: inherit; text-decoration: none; transition: color var(--t-quick), opacity var(--t-quick); }

/* =========================================================================
   EMPHASIS UTILITIES (the brand's device set: accent color, underline, pill)
   ========================================================================= */
.em-cyan      { color: var(--accent); }
.em-blue      { color: var(--accent-strong); }
.em-gray      { color: var(--fg-2); }
.em-underline { text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 5px; text-decoration-color: var(--accent); }

/* Rounded pill for standalone figures / percentages that need attention */
.pill-figure {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: var(--ieb-cyan-soft);
  color: var(--accent-strong);
  border-radius: var(--radius-pill);
  padding: 4px 14px;
  font-family: var(--font-mono);
  font-weight: var(--fw-medium);
  font-size: var(--fs-body-sm);
  letter-spacing: var(--tr-snug);
}

/* Surface helpers */
.surface-black { background: var(--surface-dark); color: var(--fg-on-dark-1); }
.surface-white { background: var(--ieb-white); color: var(--fg-1); }
.surface-muted { background: var(--surface-muted); color: var(--fg-1); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; scroll-behavior: auto !important; }
}

/* =============================================================================
   IEB External Advisors — Homepage styles
   Design system: Key Visual 2026. Black/White 60/30, accent Celeste #00A6FB
   (emphasis) + Azul IEB #404EFF (CTA). Poly Sans. Minimal, flat, spacious.
   Tokens live in assets/colors_and_type.css.
   ============================================================================= */

*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; }
img { max-width: 100%; display: block; }
::selection { background: var(--ieb-cyan); color: var(--ieb-black); }
:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 3px; }
html { scroll-behavior: smooth; }

/* ---------- Layout primitives ---------------------------------------------- */
.container { width: 100%; max-width: var(--container-max); margin-inline: auto; padding-inline: clamp(20px, 5vw, 40px); }

.section { padding-block: clamp(64px, 9vw, 112px); position: relative; }

.sec-head { max-width: 660px; margin-bottom: clamp(36px, 5vw, 60px); }
.sec-head .eyebrow { display: block; margin-bottom: 16px; }
.sec-head h2 { margin: 0; }
.sec-lead { color: var(--fg-2); font-size: var(--fs-body-lg); line-height: var(--lh-body); margin-top: 20px; max-width: 60ch; }
.surface-black .sec-lead { color: var(--fg-on-dark-2); }

/* ---------- Buttons -------------------------------------------------------- */
.btn {
  display: inline-flex; align-items: center; gap: 8px;
  font-family: var(--font-body); font-size: var(--fs-body-sm); font-weight: var(--fw-medium);
  letter-spacing: var(--tr-snug); line-height: 1;
  padding: 13px 22px; border-radius: var(--radius-md); border: 1px solid transparent;
  cursor: pointer; transition: background var(--t-standard), color var(--t-standard), border-color var(--t-standard), transform var(--t-quick);
  white-space: nowrap;
}
.btn svg { transition: transform var(--t-standard); }
.btn:hover svg { transform: translateX(3px); }
.btn--accent { background: var(--accent-strong); color: var(--accent-ink); }
.btn--accent:hover { background: var(--ieb-blue-hover); }
.btn--dark { background: var(--ieb-black); color: var(--ieb-white); }
.btn--dark:hover { background: var(--gray-800); }
.btn--outline { background: transparent; color: var(--ieb-black); border-color: var(--border-default); }
.btn--outline:hover { border-color: var(--ieb-black); }
.btn--ghost-dark { background: transparent; color: var(--ieb-white); border-color: var(--border-on-dark); }
.btn--ghost-dark:hover { background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.4); }

/* ===========================================================================
   NAV
   =========================================================================== */
.nav { position: sticky; top: 0; z-index: 100; background: rgba(255,255,255,0.92); backdrop-filter: saturate(1.4) blur(12px); border-bottom: 1px solid transparent; transition: border-color var(--t-standard), box-shadow var(--t-standard); }
.nav.is-scrolled { border-bottom-color: var(--border-subtle); box-shadow: var(--shadow-sm); }
.nav__inner { max-width: var(--container-max); margin-inline: auto; padding: 14px clamp(20px, 5vw, 40px); display: flex; align-items: center; justify-content: space-between; gap: 24px; }
.nav__logo { display: flex; align-items: center; flex-shrink: 0; }
.nav__logo-img { height: 20px; width: auto; }
.nav__links { display: flex; align-items: center; gap: clamp(18px, 2.4vw, 34px); }
.nav__link { font-size: var(--fs-body-sm); font-weight: var(--fw-regular); color: var(--gray-700); position: relative; padding-block: 6px; }
.nav__link:hover { color: var(--ieb-black); }
.nav__link.is-active { color: var(--ieb-black); }
.nav__link.is-active::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: var(--accent); }
.nav__cta { background: var(--accent-strong); color: var(--ieb-white); font-size: var(--fs-body-sm); font-weight: var(--fw-medium); padding: 10px 18px; border-radius: var(--radius-md); transition: background var(--t-standard); }
.nav__cta:hover { background: var(--ieb-blue-hover); }
.nav__cta--mobile { display: none; }
.nav__menu-btn { display: none; flex-direction: column; gap: 5px; background: none; border: 0; cursor: pointer; padding: 8px; }
.nav__menu-btn span { width: 22px; height: 2px; background: var(--ieb-black); transition: transform var(--t-standard); }

/* ===========================================================================
   HERO
   =========================================================================== */
.hero { position: relative; background: var(--ieb-black); color: var(--ieb-white); overflow: hidden; min-height: min(88vh, 760px); display: flex; align-items: center; }
.hero__media { position: absolute; inset: 0; z-index: 0; }
.hero__media-img { position: absolute; inset: -4%; background: var(--gray-950) url('assets/fotos/oficina-1.jpg') center/cover no-repeat; transform: scale(1.04); animation: heroPan 26s var(--ease-standard) 2 alternate forwards; will-change: transform; }
@keyframes heroPan { from { transform: scale(1.04) translate3d(0,0,0); } to { transform: scale(1.12) translate3d(-1.5%, -1.5%, 0); } }
.hero__pattern { position: absolute; inset: 0; background-image: repeating-linear-gradient(115deg, rgba(255,255,255,.5) 0, rgba(255,255,255,.5) 1px, transparent 1px, transparent 26px); opacity: .10; mix-blend-mode: overlay; }
.hero__scrim { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(0,0,0,.92) 0%, rgba(0,0,0,.78) 42%, rgba(0,0,0,.42) 100%), linear-gradient(0deg, rgba(0,0,0,.6), transparent 60%); }
.hero__container { position: relative; z-index: 1; padding-block: clamp(96px, 14vh, 140px); }
.hero__copy { max-width: 720px; }
.hero__eyebrow { color: var(--ieb-cyan); display: block; margin-bottom: 22px; }
.hero__title { margin: 0; font-weight: var(--fw-medium); }
.hero__sub { margin-top: 24px; color: var(--fg-on-dark-2); max-width: 54ch; }
.hero__cta-row { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 36px; }
.hero__proof { display: flex; align-items: center; flex-wrap: wrap; gap: 16px; margin-top: 40px; color: var(--fg-on-dark-2); font-size: var(--fs-body-sm); font-family: var(--font-mono); letter-spacing: var(--tr-snug); }
.hero__proof span { display: inline-flex; align-items: center; gap: 7px; }
.hero__proof span svg { color: var(--ieb-cyan); }
.hero__proof-sep { width: 4px; height: 4px; border-radius: 50%; background: var(--gray-500); }

/* ===========================================================================
   SIMULADOR (signature)
   =========================================================================== */
/* Simulador runs ~20% tighter vertically than the standard section rhythm */
.sim.section { padding-block: clamp(36px, 4.5vw, 56px); }
.sim .sec-head { margin-bottom: clamp(24px, 3vw, 38px); }
.sim__grid { display: grid; grid-template-columns: 1fr 1.05fr; gap: clamp(28px, 4vw, 56px); align-items: start; }
.sim__controls { display: flex; flex-direction: column; gap: 28px; }
.sim__field { display: flex; flex-direction: column; gap: 14px; }
.sim__label { font-size: var(--fs-body-sm); color: var(--fg-2); display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.sim__label-val { font-family: var(--font-mono); font-weight: var(--fw-medium); color: var(--accent-strong); font-size: var(--fs-body-lg); }
.sim__input-wrap { display: flex; align-items: center; border: 1px solid var(--border-default); border-radius: var(--radius-md); overflow: hidden; transition: border-color var(--t-standard); }
.sim__input-wrap:focus-within { border-color: var(--accent); }
.sim__input-prefix { padding: 0 14px; color: var(--fg-2); font-family: var(--font-mono); font-size: var(--fs-body-sm); border-right: 1px solid var(--border-subtle); align-self: stretch; display: flex; align-items: center; }
.sim__input { flex: 1; border: 0; padding: 16px 16px; font-family: var(--font-mono); font-size: var(--fs-h3); font-weight: var(--fw-medium); color: var(--ieb-black); background: transparent; width: 100%; }
.sim__input:focus { outline: none; }
.sim__range { -webkit-appearance: none; appearance: none; width: 100%; height: 6px; border-radius: var(--radius-pill); outline: none; cursor: pointer; }
.sim__range::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 22px; height: 22px; border-radius: 50%; background: var(--ieb-white); border: 3px solid var(--accent-strong); box-shadow: var(--shadow-sm); cursor: pointer; }
.sim__range::-moz-range-thumb { width: 22px; height: 22px; border-radius: 50%; background: var(--ieb-white); border: 3px solid var(--accent-strong); cursor: pointer; }
.sim__range-labels { display: flex; justify-content: space-between; font-family: var(--font-mono); font-size: var(--fs-caption); color: var(--fg-3); }

.sim__result { background: var(--ieb-black); color: var(--ieb-white); border-radius: var(--radius-lg); padding: clamp(20px, 2.4vw, 30px); }

  <h1>IEB External Advisors — La propuesta de Grupo IEB para asesores financieros externos en Argentina</h1>
  <p>IEB External Advisors es la propuesta de Grupo IEB —fundado por Juan Ignacio Abuchdid en 2011— para asesores financieros y agentes productores independientes en Argentina: el payout más alto del mercado, estructura para desarrollar equipo propio, tecnología y beneficios, sin resignar independencia. Incluye Espacio IEB, una base de trabajo con puestos, salas de reunión, boxes privados para videollamadas, cocheras, Middle Office, charlas de mercado y comunidad profesional de pares. Ubicado en Núñez, Ciudad Autónoma de Buenos Aires. Acceso 100% gratuito, sin exclusividad.</p>
  <h2>Por qué existe Espacio IEB</h2>
  <p>El asesor financiero independiente cumple un rol clave en el mercado de capitales argentino, pero muchas veces trabaja en forma aislada: sin oficina profesional para recibir clientes, sin acceso ágil a soporte operativo, sin contacto cotidiano con especialistas y sin una comunidad donde compartir visión de mercado. Espacio IEB nace para resolver eso.</p>
  <h2>Infraestructura de Espacio IEB</h2>
  <ul>
    <li>Puestos de trabajo modernos en Núñez, CABA</li>
    <li>Salas de reunión reservables para atender clientes</li>
    <li>Boxes privados insonorizados para videollamadas</li>
    <li>Cocheras disponibles</li>
    <li>Middle Office en el mismo edificio</li>
    <li>Equipos comerciales, traders y research de Grupo IEB</li>
    <li>Charlas y encuentros del mercado de capitales argentino</li>
    <li>Comunidad de asesores financieros externos</li>
  </ul>
  <h2>Respaldo institucional — Grupo IEB</h2>
  <p>Grupo IEB es una holding financiera fundada en 2011 por Juan Ignacio Abuchdid (CEO y Fundador), con trayectoria comprobada en el mercado de capitales argentino.</p>
  <ul>
    <li>Más de USD 2.000 millones gestionados a través de Grupo IEB</li>
    <li>Más de 200 personas en el equipo IEB</li>
    <li>Más de 150 productores externos vinculados</li>
    <li>Teléfono: +54 (11) 5353-5500</li>
  </ul>
  <h2>Modelo de acceso a Espacio IEB</h2>
  <ul>
    <li>Acceso 100% gratuito para asesores financieros independientes validados por Grupo IEB — sin membresía ni pagos</li>
    <li>Sin exclusividad: el asesor sigue operando con las ALyCs con las que ya trabaja</li>
    <li>Uso flexible, sin mínimos ni horarios obligatorios</li>
    <li>Para: Agentes Productores Independientes (API), asesores en ALyCs, team leaders y asesores senior</li>
  </ul>
  <h2>Preguntas frecuentes sobre Espacio IEB</h2>
  <dl>
    <dt>¿Qué es Espacio IEB?</dt><dd>Una base operativa y comunidad para asesores financieros independientes, impulsada por Grupo IEB, en Núñez, Buenos Aires.</dd>
    <dt>¿Tiene costo?</dt><dd>No. El acceso es 100% gratuito para asesores validados. No hay membresía ni pagos.</dd>
    <dt>¿Exige exclusividad?</dt><dd>No. El asesor puede seguir operando con cualquier ALyC.</dd>
    <dt>¿Dónde queda?</dt><dd>Barrio de Núñez, Ciudad Autónoma de Buenos Aires, Argentina.</dd>

  </dl>
