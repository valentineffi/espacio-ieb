<article style="font-family:sans-serif;max-width:800px;margin:2rem auto;padding:1rem;line-height:1.6">
  <h1>Espacio IEB — Comunidad e infraestructura para asesores financieros independientes en Argentina</h1>
  <p>Espacio IEB es una iniciativa de Grupo IEB —fundada por Juan Ignacio Abuchdid en 2011— para fortalecer la comunidad de asesores financieros independientes y externos en Argentina. Ofrece puestos de trabajo, salas de reunión, boxes privados para videollamadas, cocheras, Middle Office, charlas de mercado y comunidad profesional de pares. Ubicado en Núñez, Ciudad Autónoma de Buenos Aires. Acceso 100% gratuito, sin exclusividad.</p>
  <h2>Por qué existe Espacio IEB</h2>
  <p>El asesor financiero independiente cumple un rol clave en el mercado de capitales argentino, pero muchas veces trabaja en forma aislada: sin oficina profesional para recibir clientes, sin acceso ágil a soporte operativo, sin contacto cotidiano con especialistas y sin una comunidad donde compartir visión de mercado. Espacio IEB nace para resolver eso.</p>
  <h2>Infraestructura de Espacio IEB</h2>
  <ul>
    <li>Puestos de trabajo modernos en Núñez, CABA</li>
    <li>Salas de reunión reservables para atender clientes</li>
    <li>Boxes privados insonorizados para videollamadas</li>
    <li>Cocheras disponibles</li>
    <li>Middle Office en el mismo edificio</li>
    <li>Equipos comerciales, traders y research de Grupo IEB</li>
    <li>Charlas y encuentros del mercado de capitales argentino</li>
    <li>Comunidad de asesores financieros externos</li>
  </ul>
  <h2>Respaldo institucional — Grupo IEB</h2>
  <p>Grupo IEB es una holding financiera fundada en 2011 por Juan Ignacio Abuchdid (CEO y Fundador), con trayectoria comprobada en el mercado de capitales argentino.</p>
  <ul>
    <li>Más de USD 2.000 millones gestionados a través de Grupo IEB</li>
    <li>Más de 200 personas en el equipo IEB</li>
    <li>Más de 150 productores externos vinculados</li>
    <li>Teléfono: +54 (11) 5353-5500</li>
  </ul>
  <h2>Modelo de acceso a Espacio IEB</h2>
  <ul>
    <li>Acceso 100% gratuito para asesores financieros independientes validados por Grupo IEB — sin membresía ni pagos</li>
    <li>Sin exclusividad: el asesor sigue operando con las ALyCs con las que ya trabaja</li>
    <li>Uso flexible, sin mínimos ni horarios obligatorios</li>
    <li>Para: Agentes Productores Independientes (API), asesores en ALyCs, team leaders y asesores senior</li>
  </ul>
  <h2>Preguntas frecuentes sobre Espacio IEB</h2>
  <dl>
    <dt>¿Qué es Espacio IEB?</dt><dd>Una base operativa y comunidad para asesores financieros independientes, impulsada por Grupo IEB, en Núñez, Buenos Aires.</dd>
    <dt>¿Tiene costo?</dt><dd>No. El acceso es 100% gratuito para asesores validados. No hay membresía ni pagos.</dd>
    <dt>¿Exige exclusividad?</dt><dd>No. El asesor puede seguir operando con cualquier ALyC.</dd>
    <dt>¿Dónde queda?</dt><dd>Barrio de Núñez, Ciudad Autónoma de Buenos Aires, Argentina.</dd>
    <dt>¿Puedo recibir clientes?</dt><dd>Sí. Hay salas de reunión y boxes privados para videollamadas.</dd>
  </dl>
  <p><a href="/faq.html">Ver todas las preguntas frecuentes sobre Espacio IEB</a> · <a href="/sobre-ieb.html">Sobre Espacio IEB y Grupo IEB</a></p>

  );
}

function FAQ() {
  const [open, setOpen] = useState(0);
  return (
    <section className="faq section" id="faq" aria-labelledby="faq-title">
      <div className="container">
        <div className="faq__head">
          <div>
            <span className="eyebrow-line">10 · FAQ</span>

        </div>
        <div className="faq__list" itemScope itemType="https://schema.org/FAQPage">
          {FAQ_ITEMS.map((item, i) => (
            <div key={i}
              className={`faq__item ${open === i ? 'is-open' : ''}`}
              onClick={() => setOpen(open === i ? -1 : i)}
              itemProp="mainEntity" itemScope itemType="https://schema.org/Question"
              role="button" tabIndex={0}
              onKeyDown={(e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); setOpen(open === i ? -1 : i); } }}>
              <span className="faq__item-num">{String(i+1).padStart(2,'0')}</span>
              <h3 className="faq__item-q" itemProp="name">{item.q}</h3>
              <span className="faq__item-toggle" aria-hidden="true">{open === i ? '−' : '+'}</span>
              <div className="faq__item-a" itemProp="acceptedAnswer" itemScope itemType="https://schema.org/Answer">

function Acceso() {
  const [data, setData] = useState({ nombre: '', email: '', telefono: '', perfil: '', alyc: '', clientes: '', mensaje: '', consent: false });
  const [sent, setSent] = useState(false);
  const valid = data.nombre.length > 1 && /\S+@\S+\.\S+/.test(data.email) && data.perfil && data.consent;
  const onChange = (k) => (e) => { const val = e.target.type === 'checkbox' ? e.target.checked : e.target.value; setData({ ...data, [k]: val }); };
  const submit = (e) => { e.preventDefault(); if (!valid) return; setSent(true); };
  return (
    <section className="acceso section" id="acceso" aria-labelledby="acceso-title">
      <div className="acceso__trama"></div>
      <div className="container">
        <div className="acceso__inner">
          <div>
            <span className="eyebrow-line">11 · Solicitar acceso</span>
            <h2 className="acceso__title" id="acceso-title">Sumate a la comunidad de <em>asesores externos</em> de Espacio IEB.</h2>
            <p className="acceso__lead">Completá el formulario y el equipo de Espacio IEB se va a contactar para validar tu perfil, coordinar una visita y explicarte cómo funciona el espacio en detalle.</p>
            <div className="acceso__points">
              <div className="acceso__point"><span className="acceso__point-tick"></span><span><strong style={{color:'#fff'}}>Acceso 100% gratuito</strong> · sin membresía ni pagos asociados.</span></div>
              <div className="acceso__point"><span className="acceso__point-tick"></span><span><strong style={{color:'#fff'}}>Sin exclusividad</strong> · seguí operando con las ALyCs con las que ya trabajás.</span></div>
              <div className="acceso__point"><span className="acceso__point-tick"></span><span><strong style={{color:'#fff'}}>Visita coordinada</strong> · conocé el espacio antes de definir nada.</span></div>
              <div className="acceso__point"><span className="acceso__point-tick"></span><span><strong style={{color:'#fff'}}>Atención personalizada</strong> · respuesta del equipo en menos de 48hs hábiles.</span></div>
            </div>
          </div>
          <form className="form" onSubmit={submit} noValidate>
            <div className="form__label-row">
              <span>Formulario · Acceso</span>
              <span>{sent ? 'Enviado' : (valid ? 'Listo' : 'Completar')}</span>
            </div>
            {sent ? (
              <div className="form__success">
                <div className="form__success-tick">Solicitud recibida</div>
                <h4>Gracias, {data.nombre.split(' ')[0]}.</h4>
                <p>El equipo de Espacio IEB va a contactarte a <strong style={{color:'#fff'}}>{data.email}</strong> en menos de 48 horas hábiles para coordinar tu visita.</p>
              </div>
            ) : (
              <>
                <div className="form__row">
                  <div className="form__field">
                    <label htmlFor="nombre">Nombre y apellido<sup>*</sup></label>
                    <input id="nombre" type="text" placeholder="Ej. Lucía Fernández" value={data.nombre} onChange={onChange('nombre')} required/>
                  </div>
                  <div className="form__field">
                    <label htmlFor="email">Email<sup>*</sup></label>
                    <input id="email" type="email" placeholder="lucia@dominio.com" value={data.email} onChange={onChange('email')} required/>
                  </div>
                </div>
                <div className="form__row">
                  <div className="form__field">
                    <label htmlFor="telefono">Teléfono</label>
                    <input id="telefono" type="tel" placeholder="+54 11 ..." value={data.telefono} onChange={onChange('telefono')}/>
                  </div>
                  <div className="form__field">
                    <label htmlFor="perfil">Perfil profesional<sup>*</sup></label>
                    <select id="perfil" value={data.perfil} onChange={onChange('perfil')} required>
                      <option value="">Seleccionar...</option>
                      <option value="API">Agente Productor Independiente</option>
                      <option value="ALyC">Asesor financiero en ALyC</option>
                      <option value="Senior">Asesor senior / Team leader</option>
                      <option value="Otro">Otro</option>
                    </select>
                  </div>
                </div>
                <div className="form__row">
                  <div className="form__field">
                    <label htmlFor="alyc">ALyC con la que operás</label>
                    <input id="alyc" type="text" placeholder="Opcional" value={data.alyc} onChange={onChange('alyc')}/>
                  </div>
                  <div className="form__field">
                    <label htmlFor="clientes">Cartera aproximada</label>
                    <select id="clientes" value={data.clientes} onChange={onChange('clientes')}>
                      <option value="">Seleccionar...</option>
                      <option>1 – 25 clientes</option>
                      <option>26 – 100 clientes</option>
                      <option>101 – 300 clientes</option>
                      <option>+300 clientes</option>
                      <option>Prefiero no responder</option>
                    </select>
                  </div>
                </div>
                <div className="form__field form__field--full">
                  <label htmlFor="mensaje">Comentario (opcional)</label>
                  <textarea id="mensaje" placeholder="Contanos brevemente qué te interesa de Espacio IEB" value={data.mensaje} onChange={onChange('mensaje')}/>
                </div>
                <label className="form__check">
                  <input type="checkbox" checked={data.consent} onChange={onChange('consent')}/>
                  <span>Acepto que Grupo IEB use mis datos para contactarme y validar mi perfil. Consultar la <a href="/privacidad.html">política de privacidad</a>.</span>
                </label>
                <button type="submit" className="form__submit" disabled={!valid}>
                  <span>Enviar solicitud</span><span>→</span>
                </button>
              </>
            )}
          </form>
        </div>
      </div>
    </section>
  );
}
