/* =============================================================================
   Espacio IEB — Design System
   Colors + Typography Foundations
   -----------------------------------------------------------------------------
   Source of truth: Brandbook_EspacioIEB_2026 (Versión Abril 2026).
   Espacio IEB is the brand for IEB's external-advisors program — a workspace
   and partnership offering for independent financial advisors in Argentina.
   ============================================================================= */

/* ---------- FONTS ----------------------------------------------------------- */
/* Poly Sans (Pangram Pangram) — the brandbook's official typeface, now        */
/* loaded from local trial files in /fonts. Six weights map to four CSS slots: */
/*   Slim (300) → Neutral (400) → Median (500) → Bulky (700)                   */
/* Italic + Mono + Wide variants are exposed as separate families for editorial*/
/* moments. The brandbook calls primarily for Poly Sans Slim (300) on display. */

@font-face { font-family: 'Poly Sans'; src: url('assets/fonts/polysanstrial-slim.woff2') format('woff2'), url('assets/fonts/polysanstrial-slim.otf') format('opentype');         font-weight: 300; font-style: normal; font-display: swap; }
@font-face { font-family: 'Poly Sans'; src: url('assets/fonts/polysanstrial-neutral.woff2') format('woff2'), url('assets/fonts/polysanstrial-neutral.otf') format('opentype');   font-weight: 400; font-style: normal; font-display: swap; }
@font-face { font-family: 'Poly Sans'; src: url('assets/fonts/polysanstrial-median.woff2') format('woff2'), url('assets/fonts/polysanstrial-median.otf') format('opentype');     font-weight: 500; font-style: normal; font-display: swap; }
@font-face { font-family: 'Poly Sans'; src: url('assets/fonts/polysanstrial-bulky.woff2') format('woff2'), url('assets/fonts/polysanstrial-bulky.otf') format('opentype');       font-weight: 700; font-style: normal; font-display: swap; }

/* Mono — for ticker, tabular numerals, code-y micro-copy */
@font-face { font-family: 'Poly Sans Mono'; src: url('assets/fonts/polysanstrial-slimmono.woff2') format('woff2'), url('assets/fonts/polysanstrial-slimmono.otf') format('opentype');     font-weight: 300; font-style: normal; font-display: swap; }
@font-face { font-family: 'Poly Sans Mono'; src: url('assets/fonts/polysanstrial-medianmono.woff2') format('woff2'), url('assets/fonts/polysanstrial-medianmono.otf') format('opentype'); font-weight: 500; font-style: normal; font-display: swap; }

:root {
  /* =========================================================================
     COLOR — strict 60/30/10 institutional palette
     -------------------------------------------------------------------------
     The brandbook is explicit: only 3 colors. Black or White take 60% of
     any composition (large surfaces / fields), the other Black or White
     takes 30% (typography), Yellow takes 10% (CTAs, highlights, key data).
     Black ↔ White can swap dominant/secondary roles depending on tone.
     Yellow is the *activador visual* — never used as a 60% wash.
     ========================================================================= */

  /* — Core trio — */
  --ieb-black:          #1D1D1B;   /* near-black — institutional anchor */
  --ieb-white:          #FFFFFF;
  --ieb-yellow:         #FDE100;   /* signature accent */

  /* — Black tonal scale (for hairlines, panels on dark, hover states) — */
  --ieb-black-95:       #28282710;
  --ieb-ink-08:         #0A0A0A;   /* deeper than spec black, hero blacks */
  --ieb-ink-12:         #121212;
  --ieb-ink-14:         #141414;
  --ieb-ink-1c:         #1C1C1C;
  --ieb-ink-line:       #2A2A28;   /* hairline on dark */

  /* — White tonal scale (off-whites for cream-ish surfaces) — */
  --ieb-paper:          #F5F5F3;   /* off-white surface for content sections */
  --ieb-paper-soft:     #FAFAF8;
  --ieb-paper-line:     #E0E0DE;   /* hairline on light */

  /* — Yellow tonal scale (accents only — never 60%) — */
  --ieb-yellow-warm:    #FFE94D;   /* hover lift */
  --ieb-yellow-deep:    #E6CC00;   /* press / underline depth */

  /* — Functional grays (text only — yellow/gray are the two emphasis tints) */
  --ieb-gray-key:       #888888;   /* "Color de Acento: Amarillo o Gris" */
  --ieb-gray-dim:       #666666;
  --ieb-gray-mute:      #444444;

  /* =========================================================================
     SEMANTIC ROLES — by 60/30/10 dominance
     ========================================================================= */

  /* 60% — dominant surface */
  --surface-page:       var(--ieb-black);            /* default = black-led */
  --surface-page-light: var(--ieb-white);            /* alternate = white-led */
  --surface-paper:      var(--ieb-paper);            /* warm off-white panels */
  --surface-card-dark:  var(--ieb-ink-12);           /* card on black */
  --surface-card-light: var(--ieb-white);            /* card on light */

  /* 30% — typography / secondary fields */
  --fg-on-dark-1:       var(--ieb-white);
  --fg-on-dark-2:       rgba(255,255,255,0.72);
  --fg-on-dark-3:       rgba(255,255,255,0.65);
  --fg-on-light-1:      var(--ieb-black);
  --fg-on-light-2:      rgba(29,29,27,0.68);
  --fg-on-light-3:      rgba(29,29,27,0.44);

  /* 10% — accent */
  --accent:             var(--ieb-yellow);
  --accent-ink:         var(--ieb-black);            /* text on yellow */
  --accent-deep:        var(--ieb-yellow-deep);
  --accent-warm:        var(--ieb-yellow-warm);

  /* — Borders / hairlines — */
  --border-on-dark:     var(--ieb-ink-line);
  --border-on-light:    var(--ieb-paper-line);
  --border-subtle:      rgba(0,0,0,0.08);

  /* — Status (kept narrow — brand is monochrome) — */
  --success:            var(--ieb-yellow);
  --warning:            var(--ieb-yellow-deep);
  --info:               var(--ieb-gray-key);
  --danger:             #E5484D;

  /* =========================================================================
     ELEVATION / RADII / SPACING
     -------------------------------------------------------------------------
     Brandbook says: NO SHADOWS on type. We extend that to a general
     preference for flat surfaces — shadows below are ONLY for floating
     UI affordances (modals, tooltips, hover lifts on cards), not headlines.
     ========================================================================= */

  --shadow-card:        0 8px 32px rgba(0,0,0,0.09);
  --shadow-raised:      0 20px 48px rgba(0,0,0,0.13);
  --shadow-on-dark:     0 12px 40px rgba(0,0,0,0.45);

  /* — Radii — Espacio IEB is angular and editorial. Sharp 0–4px corners.    */
  /*   Pills (999px) are intentionally NOT part of the system.                */
  --radius-0:           0;
  --radius-xs:          2px;
  --radius-sm:          4px;
  --radius-md:          4px;       /* default for buttons (rare) */

  /* — Spacing scale — */
  --space-1:            4px;
  --space-2:            8px;
  --space-3:            12px;
  --space-4:            16px;
  --space-5:            20px;
  --space-6:            24px;
  --space-8:            32px;
  --space-10:           40px;
  --space-12:           48px;
  --space-14:           56px;      /* container horizontal padding default */
  --space-16:           64px;
  --space-20:           80px;
  --space-24:           96px;

  /* — Transitions — */
  --t-quick:            0.15s ease;
  --t-standard:         0.2s ease;
  --t-smooth:           0.4s ease;

  /* =========================================================================
     TYPOGRAPHY
     -------------------------------------------------------------------------
     Brandbook: Poly Sans Slim is the *only* institutional typeface.
     - Hierarchy by SIZE, not by family swaps.
     - Yellow OR gray for accent words / numerical data.
     - Underline for emphasis (single line, never decorative).
     - Pastilla / recuadro for callout numbers and percentages.
     - NO TEXT SHADOWS. Ever.
     ========================================================================= */

  --font-sans:    'Poly Sans', system-ui, -apple-system, sans-serif;
  --font-display: 'Poly Sans', system-ui, -apple-system, sans-serif;
  --font-body:    'Poly Sans', system-ui, -apple-system, sans-serif;
  --font-wide:    'Poly Sans Wide', 'Poly Sans', system-ui, sans-serif;
  --font-mono:    'Poly Sans Mono', ui-monospace, 'SF Mono', monospace;

  /* — Type scale — Poly Sans Slim renders airy; we lean on size for hierarchy. */
  --fs-display-xl:   clamp(56px, 7vw, 104px);   /* hero / brand statement */
  --fs-display-lg:   clamp(44px, 5.5vw, 80px);  /* landing hero h1 */
  --fs-display-md:   clamp(34px, 4vw, 56px);    /* section opener */
  --fs-h1:           clamp(28px, 3vw, 44px);
  --fs-h2:           clamp(24px, 2.4vw, 36px);
  --fs-h3:           20px;
  --fs-h4:           17px;
  --fs-body-lg:      18px;
  --fs-body:         16px;
  --fs-body-sm:      14px;
  --fs-caption:      13px;
  --fs-eyebrow:      11px;     /* uppercase eyebrow / "tag" labels */
  --fs-ticker:       12px;

  /* — Weights — Poly Sans Slim ships with weight variations; use sparingly. */
  --fw-light:        300;
  --fw-regular:      400;
  --fw-medium:       500;
  --fw-bold:         700;

  /* — Line heights — */
  --lh-tight:        1.05;
  --lh-snug:         1.12;
  --lh-normal:       1.35;
  --lh-body:         1.6;
  --lh-loose:        1.8;

  /* — Tracking — Poly Sans behaves well at -0.01 to -0.02em on display. */
  --tr-tight:        -0.02em;
  --tr-snug:         -0.01em;
  --tr-normal:       0;
  --tr-wide:         0.08em;     /* eyebrows, ticker, tags */
  --tr-extra-wide:   0.2em;      /* the brand's signature uppercase eyebrow */
}

/* =========================================================================
   SEMANTIC ELEMENT STYLES
   ========================================================================= */

html, body {
  font-family: var(--font-body);
  font-size: var(--fs-body);
  line-height: var(--lh-body);
  color: var(--fg-on-dark-1);
  background: var(--surface-page);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

h1, .h1, h2, .h2, h3, .h3, h4, .h4,
.display-xl, .display-lg, .display-md {
  font-family: var(--font-display);
  font-weight: var(--fw-bold);
  letter-spacing: var(--tr-tight);
  line-height: var(--lh-snug);
  text-wrap: balance;
}

.display-xl { font-size: var(--fs-display-xl); line-height: var(--lh-tight); font-weight: var(--fw-bold); }
.display-lg { font-size: var(--fs-display-lg); line-height: var(--lh-tight); font-weight: var(--fw-bold); }
.display-md { font-size: var(--fs-display-md); line-height: var(--lh-tight); font-weight: var(--fw-bold); }

h1, .h1 { font-size: var(--fs-h1); font-weight: var(--fw-bold); }
h2, .h2 { font-size: var(--fs-h2); font-weight: var(--fw-bold); }
h3, .h3 { font-size: var(--fs-h3); font-weight: var(--fw-medium); letter-spacing: var(--tr-snug); }
h4, .h4 { font-size: var(--fs-h4); font-weight: var(--fw-medium); letter-spacing: var(--tr-snug); }

p, .body      { font-size: var(--fs-body);    line-height: var(--lh-body); }
.body-lg      { font-size: var(--fs-body-lg); line-height: var(--lh-body); }
.body-sm      { font-size: var(--fs-body-sm); line-height: var(--lh-body); }
.caption      { font-size: var(--fs-caption); line-height: var(--lh-normal); }

/* The brand's signature eyebrow — uppercase, very wide tracking, yellow (or
   gray if subdued). Always small. Always above an h1/h2. */
.eyebrow {
  font-family: var(--font-body);
  font-size: var(--fs-eyebrow);
  font-weight: var(--fw-bold);
  letter-spacing: var(--tr-extra-wide);
  text-transform: uppercase;
  color: var(--accent);
}
.eyebrow--gray { color: var(--ieb-gray-key); }

code, pre, .mono { font-family: var(--font-mono); font-size: 0.92em; }

a {
  color: inherit;
  text-decoration: none;
  transition: color var(--t-quick), opacity var(--t-quick);
}

/* =========================================================================
   EMPHASIS UTILITIES — Brandbook-blessed:
   • em-yellow / em-gray = accent color words
   • em-underline = single-line emphasis
   • pastilla / recuadro = boxed callout for stats and percentages
   ========================================================================= */
.em-yellow     { color: var(--accent); }
.em-gray       { color: var(--ieb-gray-key); }
.em-underline  { text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 4px; text-decoration-color: var(--accent); }
.em-underline-gray { text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 4px; text-decoration-color: var(--ieb-gray-key); }

.pastilla {
  display: inline-block;
  background: var(--accent);
  color: var(--accent-ink);
  padding: 2px 12px;
  font-weight: var(--fw-bold);
  letter-spacing: var(--tr-snug);
}
.recuadro {
  display: inline-block;
  border: 2px solid var(--accent);
  color: inherit;
  padding: 4px 14px;
  font-weight: var(--fw-bold);
  letter-spacing: var(--tr-snug);
}

/* =========================================================================
   60/30/10 SURFACE HELPERS
   ========================================================================= */
.surface-black { background: var(--ieb-black); color: var(--fg-on-dark-1); }
.surface-white { background: var(--ieb-white); color: var(--fg-on-light-1); }
.surface-paper { background: var(--ieb-paper); color: var(--fg-on-light-1); }

/* The signature horizontal yellow ticker that runs between sections */
.ticker {
  background: var(--accent);
  color: var(--accent-ink);
  padding: 15px 0;
  overflow: hidden;
  white-space: nowrap;
  font-size: var(--fs-ticker);
  font-weight: var(--fw-bold);
  letter-spacing: var(--tr-wide);
  text-transform: uppercase;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: var(--font-body);
  color: var(--fg-on-dark-1);
  background: var(--ieb-black);
  line-height: var(--lh-body);
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

img { display: block; max-width: 100%; }
button { font-family: inherit; }

/* ============================================================
   GLOBAL HELPERS
   ============================================================ */
.container { max-width: 1280px; margin: 0 auto; padding: 0 56px; }
.section { padding: 100px 0; }
.section--tight { padding: 72px 0; }
.section, [id] { scroll-margin-top: 80px; }

.eyebrow-line {
  display: inline-flex; align-items: center; gap: 14px;
  font-size: 11px; font-weight: 700; letter-spacing: .22em;
  text-transform: uppercase; color: var(--accent);
  margin-bottom: 22px;
}
.eyebrow-line::before {
  content: ""; width: 28px; height: 1px; background: var(--accent);
}
.eyebrow-line.is-gray { color: var(--ieb-gray-key); }
.eyebrow-line.is-gray::before { background: var(--ieb-gray-key); }

.section-num {
  display: block;
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: .15em;
  color: var(--ieb-gray-key);
}

/* ============================================================
   NAV
   ============================================================ */
.nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  background: rgba(10,10,10,0.92); backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--ieb-ink-line);
  height: 68px;
}
.nav__inner {
  max-width: 1440px; margin: 0 auto;
  height: 100%;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 40px;
}
.nav__logo {
  display: flex; align-items: center; gap: 10px;
  text-decoration: none;
  flex-shrink: 0;
}
.nav__logo-mark { height: 28px; width: auto; }
.nav__divider { width: 1px; height: 14px; background: #333; margin: 0 4px; }
.nav__logo-sub { font-size: 11px; color: #888; font-weight: 400; letter-spacing: .04em; }

.nav__links { display: flex; gap: 24px; align-items: center; }
.nav__link {
  font-size: 12px; color: #999; cursor: pointer; text-decoration: none;
  letter-spacing: .01em; transition: color var(--t-quick);
  background: none; border: none; padding: 0; font-family: inherit;
  white-space: nowrap;
}
.nav__link:hover, .nav__link.is-active { color: #fff; }

.nav__cta {
  display: inline-flex; align-items: center; gap: 8px;
  background: var(--accent); color: var(--accent-ink);
  font-size: 12px; font-weight: 700;
  padding: 10px 20px; border: none; cursor: pointer;
  letter-spacing: .03em;
  transition: opacity var(--t-quick);
  text-decoration: none; white-space: nowrap; flex-shrink: 0;
}
.nav__cta:hover { opacity: .85; }

.nav__menu-btn { display: none; background: none; border: 1px solid #333; color: #fff; padding: 9px 14px; font-size: 12px; cursor: pointer; letter-spacing: .05em; }

/* ============================================================
   HERO
   ============================================================ */
.hero {
  position: relative; overflow: hidden;
  padding: 116px 0 72px;
  background: var(--ieb-ink-08);
  border-bottom: 1px solid var(--ieb-ink-line);
}
.hero__trama {
  position: absolute; inset: 0; opacity: .22;
  pointer-events: none;
  background-image: url('assets/tramas/trama-isometric.svg');
  background-size: 600px;
  background-position: top right;
  filter: invert(1);
}
.hero__overlay {
  position: absolute; inset: 0;
  background: linear-gradient(135deg, rgba(10,10,10,.96) 0%, rgba(10,10,10,.6) 70%, rgba(10,10,10,.2) 100%);
}
.hero__inner {
  position: relative; z-index: 2;
  display: grid; grid-template-columns: 1.4fr 1fr;
  gap: 80px; align-items: end;
}
.hero__copy { max-width: 760px; }
.hero__meta {
  display: flex; align-items: center; gap: 12px;
  font-family: var(--font-mono);
  font-size: 11px; color: #666; letter-spacing: .15em;
  text-transform: uppercase;
  margin-bottom: 28px;
}
.hero__meta-tick { width: 8px; height: 8px; background: var(--accent); flex-shrink: 0; }
.hero__title {
  font-family: var(--font-display);
  font-size: clamp(36px, 4.2vw, 62px);
  font-weight: 700; line-height: 1.05;
  letter-spacing: -.02em;
  color: #fff;
  margin-bottom: 22px;
  text-wrap: balance;
}
.hero__title em { color: var(--accent); font-style: normal; }
.hero__title u {
  text-decoration: underline;
  text-decoration-thickness: 3px;
  text-underline-offset: 8px;
  text-decoration-color: var(--accent);
}
.hero__sub {
  font-size: 17px; color: #aaa; line-height: 1.65;
  max-width: 580px; margin-bottom: 36px;
}
.hero__pills {
  display: flex; flex-wrap: wrap; gap: 8px;
  margin-bottom: 40px;
}
.hero__pill {
  display: inline-flex; align-items: center; gap: 8px;
  font-size: 12px; font-weight: 500;
  padding: 7px 14px;
  border: 1px solid #2a2a28;
  color: #ccc;
  letter-spacing: .02em;
  background: rgba(255,255,255,0.02);
}
.hero__pill--accent {
  background: var(--accent); color: var(--accent-ink); border-color: var(--accent);
  font-weight: 700;
}
.hero__pill-dot {
  width: 6px; height: 6px; background: var(--accent);
  display: inline-block; flex-shrink: 0;
}
.hero__pill--accent .hero__pill-dot { background: #000; }
.hero__cta-row { display: flex; flex-wrap: wrap; gap: 14px; }

.btn {
  display: inline-flex; align-items: center; gap: 10px;
  font-family: var(--font-body); font-weight: 700; font-size: 13.5px;
  padding: 16px 30px; border: none; cursor: pointer;
  letter-spacing: .04em;
  transition: opacity var(--t-quick), border-color var(--t-quick), color var(--t-quick), background var(--t-quick);
  text-decoration: none;
}
.btn--primary { background: var(--accent); color: var(--accent-ink); }
.btn--primary:hover { opacity: .85; }
.btn--outline { background: transparent; border: 1.5px solid #444; color: #ddd; padding: 14.5px 28px; }
.btn--outline:hover { border-color: var(--accent); color: var(--accent); }
.btn--dark { background: var(--ieb-black); color: #fff; padding: 14.5px 28px; border: 1px solid var(--ieb-black); }
.btn--dark:hover { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

.hero__aside {
  position: relative;
  border: 1px solid var(--ieb-ink-line);
  background: rgba(0,0,0,0.35);
  padding: 36px 32px;
  align-self: end;
}
.hero__aside-label {
  font-family: var(--font-mono);
  font-size: 10px; color: #666;
  letter-spacing: .2em; text-transform: uppercase;
  margin-bottom: 24px;
  display: flex; justify-content: space-between;
}
.hero__aside-label span:last-child { color: var(--accent); }
.hero__aside-stack { display: flex; flex-direction: column; gap: 20px; }
.hero__aside-row {
  display: grid; grid-template-columns: 24px 1fr auto;
  gap: 14px; align-items: baseline;
  padding-bottom: 18px;
  border-bottom: 1px solid #1c1c1c;
}
.hero__aside-row:last-child { border-bottom: none; padding-bottom: 0; }
.hero__aside-num {
  font-family: var(--font-mono); font-size: 11px;
  color: #555; letter-spacing: .1em;
}
.hero__aside-text { font-size: 14px; color: #ddd; line-height: 1.45; }
.hero__aside-tag {
  font-size: 10px; color: var(--accent);
  letter-spacing: .14em; text-transform: uppercase;
  font-weight: 700;
}

.hero__floor {
  position: relative; z-index: 2;
  display: flex; justify-content: space-between; align-items: center;
  flex-wrap: wrap; gap: 16px;
  padding-top: 36px;
  margin-top: 60px;
  border-top: 1px solid #1c1c1c;
  font-family: var(--font-mono);
  font-size: 11px; color: #555;
  letter-spacing: .15em; text-transform: uppercase;
}
.hero__floor-item { display: flex; align-items: center; gap: 10px; }
.hero__floor-item strong { color: #ddd; font-weight: 500; letter-spacing: .08em; }

/* ============================================================
   TICKER
   ============================================================ */
.ticker {
  background: var(--accent); padding: 16px 0;
  overflow: hidden; white-space: nowrap;
  border-top: 1px solid var(--ieb-ink-line);
  border-bottom: 1px solid var(--ieb-ink-line);
}
.ticker__inner { display: inline-flex; animation: ticker-scroll 36s linear infinite; }
.ticker__item {
  font-size: 12px; font-weight: 700; color: #000;
  letter-spacing: .1em; text-transform: uppercase;
  padding: 0 36px;
  display: inline-flex; align-items: center; gap: 36px;
}
.ticker__item::after {
  content: "·"; color: #000; opacity: .5; font-size: 14px;
}
@keyframes ticker-scroll {
  from { transform: translateX(0); }
  to { transform: translateX(-50%); }
}

/* ============================================================
   SECTION HEADER (shared)
   ============================================================ */
.sec-head {
  display: grid; grid-template-columns: 240px 1fr;
  gap: 72px; align-items: start;
  margin-bottom: 56px;
}
.sec-head__meta { padding-top: 8px; border-top: 1px solid; border-color: inherit; }
.sec-head__meta--dark { border-top-color: var(--ieb-ink-line); }
.sec-head__meta--light { border-top-color: var(--ieb-paper-line); }
.sec-head__num {
  font-family: var(--font-mono);
  font-size: 11px; letter-spacing: .15em;
  color: var(--ieb-gray-key);
  margin-top: 16px;
  display: block;
}
.sec-head__title {
  font-family: var(--font-display);
  font-size: clamp(30px, 3.6vw, 52px);
  font-weight: 700; line-height: 1.08;
  letter-spacing: -.02em;
  text-wrap: balance;
}
.sec-head__title em { color: var(--accent); font-style: normal; }
.sec-head__title u {
  text-decoration: underline;
  text-decoration-thickness: 2px;
  text-underline-offset: 6px;
  text-decoration-color: var(--accent);
}

/* ============================================================
   POR QUÉ EXISTE
   ============================================================ */
.tension { background: var(--ieb-black); position: relative; overflow: hidden; padding-top: 80px; }
.tension__inner {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 0;
  border-top: 1px solid var(--ieb-ink-line);
}
.tension__cell {
  padding: 80px 56px;
  min-height: 540px;
  display: flex; flex-direction: column;
  justify-content: space-between;
  position: relative;
}
.tension__cell--before {
  background: var(--ieb-ink-08);
  border-right: 1px solid var(--ieb-ink-line);
}
.tension__cell--after {
  background: var(--ieb-black);
}
.tension__label {
  font-family: var(--font-mono);
  font-size: 11px; letter-spacing: .2em;
  text-transform: uppercase;
  color: var(--ieb-gray-key);
  margin-bottom: 32px;
  display: flex; align-items: center; gap: 12px;
}
.tension__label--accent { color: var(--accent); }
.tension__label-dot {
  width: 8px; height: 8px;
  background: var(--ieb-gray-mute); flex-shrink: 0;
}
.tension__label--accent .tension__label-dot { background: var(--accent); }
.tension__heading {
  font-family: var(--font-display);
  font-size: 28px; font-weight: 700;
  line-height: 1.18; letter-spacing: -.015em;
  color: #ddd;
  margin-bottom: 24px;
}
.tension__cell--after .tension__heading { color: #fff; }
.tension__list { display: flex; flex-direction: column; gap: 14px; }
.tension__item {
  font-size: 15px; line-height: 1.55;
  padding-left: 28px; position: relative;
  color: #888;
  display: flex; align-items: flex-start; gap: 12px;
  padding-left: 0;
}
.tension__item-icon {
  width: 18px; height: 18px; flex-shrink: 0;
  margin-top: 2px;
  display: flex; align-items: center; justify-content: center;
  color: var(--ieb-gray-mute);
}
.tension__cell--after .tension__item { color: #ccc; }
.tension__cell--after .tension__item-icon { color: var(--accent); }
.tension__big {
  font-family: var(--font-display);
  font-size: clamp(26px, 3vw, 40px);
  font-weight: 700; line-height: 1.1;
  letter-spacing: -.02em;
  color: #fff;
  text-wrap: balance;
  margin-top: 40px;
}
.tension__big em { color: var(--accent); font-style: normal; }

.tension__cap {
  background: var(--ieb-ink-08);
  border-top: 1px solid var(--ieb-ink-line);
  padding: 36px 0;
}
.tension__cap-inner {
  display: flex; align-items: baseline; justify-content: space-between;
  gap: 32px; flex-wrap: wrap;
}
.tension__cap-text {
  font-family: var(--font-display);
  font-size: 22px; font-weight: 500;
  color: #ddd; letter-spacing: -.01em;
  max-width: 740px;
}
.tension__cap-text em { color: var(--accent); font-style: normal; font-weight: 700; }

/* ============================================================
   QUÉ ES
   ============================================================ */
.que-es {
  background: var(--ieb-paper);
  color: var(--fg-on-light-1);
  border-top: 1px solid var(--ieb-paper-line);
}
.que-es__top {
  display: grid; grid-template-columns: 240px 1fr;
  gap: 72px; padding-bottom: 64px;
  border-bottom: 1px solid var(--ieb-paper-line);
}
.que-es__title {
  font-family: var(--font-display);
  font-size: clamp(36px, 4.4vw, 64px);
  font-weight: 700; line-height: 1.04;
  letter-spacing: -.025em;
  color: var(--ieb-black);
  text-wrap: balance;
}
.que-es__title em {
  color: var(--ieb-black); font-style: normal;
  background: var(--accent); padding: 0 8px;
}
.que-es__lead {
  font-size: 18px; color: #444; line-height: 1.65;
  max-width: 720px; margin-top: 28px;
}

.que-es__cols {
  display: grid; grid-template-columns: repeat(3, 1fr);
  gap: 0; margin-top: 64px;
}
.que-es__col {
  padding: 36px 36px 36px 0;
  border-right: 1px solid var(--ieb-paper-line);
}
.que-es__col:last-child { border-right: none; }
.que-es__col:not(:first-child) { padding-left: 36px; }
.que-es__col-num {
  font-family: var(--font-mono);
  font-size: 11px; letter-spacing: .18em;
  color: var(--ieb-gray-key);
  margin-bottom: 18px;
  display: flex; align-items: center; gap: 10px;
}
.que-es__col-num::before {
  content: ""; width: 8px; height: 8px; background: var(--accent); flex-shrink: 0;
}
.que-es__col-title {
  font-family: var(--font-display);
  font-size: 22px; font-weight: 700;
  letter-spacing: -.01em; line-height: 1.2;
  color: var(--ieb-black);
  margin-bottom: 14px;
}
.que-es__col-body {
  font-size: 14.5px; color: #555; line-height: 1.65;
}

/* ============================================================
   BENEFICIOS
   ============================================================ */
.beneficios {
  background: var(--ieb-black);
  border-top: 1px solid var(--ieb-ink-line);
}
.beneficios__head {
  padding-bottom: 56px;
  border-bottom: 1px solid var(--ieb-ink-line);
  margin-bottom: 0;
}
.beneficios__grid {
  display: grid; grid-template-columns: repeat(3, 1fr);
  gap: 1px; background: var(--ieb-ink-line);
  margin: 0 -56px;
  border-bottom: 1px solid var(--ieb-ink-line);
}
.benefit {
  background: var(--ieb-ink-08);
  padding: 48px 40px 56px;
  transition: background var(--t-standard);
  position: relative;
  cursor: default;
}
.benefit:hover { background: var(--ieb-ink-12); }
.benefit__num {
  font-family: var(--font-mono);
  font-size: 11px; color: var(--ieb-gray-key);
  letter-spacing: .15em;
  margin-bottom: 100px;
  display: flex; justify-content: space-between;
}
.benefit__num-arrow { color: var(--accent); transition: transform var(--t-standard); }
.benefit:hover .benefit__num-arrow { transform: translate(4px, -4px); }
.benefit__icon {
  width: 40px; height: 40px;
  margin-bottom: 24px;
  color: var(--accent);
}
.benefit__title {
  font-family: var(--font-display);
  font-size: 24px; font-weight: 700;
  letter-spacing: -.015em; line-height: 1.15;
  color: #fff;
  margin-bottom: 16px;
}
.benefit__title em { color: var(--accent); font-style: normal; }
.benefit__body {
  font-size: 14.5px; color: #888; line-height: 1.65;
  margin-bottom: 28px;
}
.benefit__tags {
  display: flex; flex-wrap: wrap; gap: 6px;
}
.benefit__tag {
  font-size: 10.5px; color: #aaa;
  padding: 5px 10px;
  border: 1px solid #2a2a28;
  letter-spacing: .04em;
}

/* ============================================================
   COMUNIDAD
   ============================================================ */
.comunidad {
  background: var(--ieb-paper);
  color: var(--fg-on-light-1);
  position: relative; overflow: hidden;
}
.comunidad__head {
  display: grid; grid-template-columns: 1.1fr 1fr;
  gap: 80px; align-items: end;
  padding-bottom: 56px;
  border-bottom: 1px solid var(--ieb-paper-line);
  margin-bottom: 56px;
}
.comunidad__title {
  font-family: var(--font-display);
  font-size: clamp(34px, 4vw, 56px);
  font-weight: 700; line-height: 1.05;
  letter-spacing: -.022em;
  color: var(--ieb-black);
  text-wrap: balance;
}
.comunidad__title em {
  color: var(--ieb-black); font-style: normal;
  border-bottom: 4px solid var(--accent);
  padding-bottom: 2px;
}
.comunidad__lead {
  font-size: 16.5px; color: #555; line-height: 1.7;
}
.comunidad__lead strong { color: var(--ieb-black); font-weight: 500; }

.comunidad__grid {
  display: grid; grid-template-columns: repeat(5, 1fr);
  gap: 1px; background: var(--ieb-paper-line);
  border: 1px solid var(--ieb-paper-line);
}
.com-block {
  background: var(--ieb-paper);
  padding: 32px 24px 36px;
  display: flex; flex-direction: column;
  min-height: 280px;
  transition: background var(--t-standard);
}
.com-block:hover { background: #FFF; }
.com-block__num {
  font-family: var(--font-mono);
  font-size: 10.5px; color: var(--ieb-gray-key);
  letter-spacing: .18em;
  margin-bottom: 40px;
}
.com-block__icon {
  width: 36px; height: 36px;
  margin-bottom: 20px;
  color: var(--ieb-black);
  position: relative;
}
.com-block__icon svg {
  width: 100%; height: 100%;
}
.com-block__icon::after {
  content: ""; position: absolute;
  width: 8px; height: 8px; background: var(--accent);
  top: -1px; right: -1px;
}
.com-block__title {
  font-family: var(--font-display);
  font-size: 17px; font-weight: 700;
  letter-spacing: -.01em; line-height: 1.25;
  color: var(--ieb-black);
  margin-bottom: 8px;
}
.com-block__body {
  font-size: 13px; color: #666; line-height: 1.55;
  margin-top: auto;
}

/* ============================================================
   PARA QUIÉN
   ============================================================ */
.audience {
  background: var(--ieb-black);
  border-top: 1px solid var(--ieb-ink-line);
  position: relative;
}
.audience__head {
  padding-bottom: 56px;
  border-bottom: 1px solid var(--ieb-ink-line);
  margin-bottom: 0;
}
.audience__grid {
  display: grid; grid-template-columns: repeat(4, 1fr);
  gap: 1px; background: var(--ieb-ink-line);
  margin: 0 -56px;
  border-bottom: 1px solid var(--ieb-ink-line);
}
.aud {
  background: var(--ieb-ink-08);
  padding: 40px 32px 44px;
  display: flex; flex-direction: column;
  min-height: 380px;
  transition: background var(--t-standard);
}
.aud:hover { background: var(--ieb-ink-12); }
.aud__num {
  font-family: var(--font-display);
  font-size: 64px; font-weight: 700;
  color: var(--accent);
  letter-spacing: -.04em; line-height: 1;
  margin-bottom: 24px;
}
.aud__title {
  font-family: var(--font-display);
  font-size: 18px; font-weight: 700;
  color: #fff; line-height: 1.25;
  margin-bottom: 12px;
  letter-spacing: -.01em;
}
.aud__body {
  font-size: 13.5px; color: #888;
  line-height: 1.6;
  margin-bottom: 20px;
}
.aud__tag {
  margin-top: auto;
  font-size: 10.5px; color: var(--accent);
  letter-spacing: .15em; text-transform: uppercase;
  font-weight: 700;
}

/* ============================================================
   INFRAESTRUCTURA
   ============================================================ */
.infra {
  background: var(--ieb-paper);
  color: var(--fg-on-light-1);
  position: relative;
}
.infra__top {
  display: grid; grid-template-columns: 240px 1fr 1fr;
  gap: 56px; align-items: end;
  padding-bottom: 56px;
  border-bottom: 1px solid var(--ieb-paper-line);
  margin-bottom: 0;
}
.infra__title {
  font-family: var(--font-display);
  font-size: clamp(30px, 3.6vw, 48px);
  font-weight: 700; line-height: 1.08;
  letter-spacing: -.022em;
  color: var(--ieb-black);
  text-wrap: balance;
}
.infra__lead {
  font-size: 15px; color: #555;
  line-height: 1.65;
}
.infra__main {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 0;
  margin: 0 -56px;
}
.infra__col {
  padding: 56px;
  border-right: 1px solid var(--ieb-paper-line);
}
.infra__col:last-child { border-right: none; }
.infra__col-label {
  font-family: var(--font-mono);
  font-size: 10.5px; letter-spacing: .18em;
  text-transform: uppercase;
  color: var(--ieb-gray-key);
  display: flex; align-items: center; gap: 10px;
  margin-bottom: 28px;
  padding-bottom: 14px;
  border-bottom: 1px solid var(--ieb-paper-line);
}
.infra__col-label::before {
  content: ""; width: 8px; height: 8px; background: var(--accent); flex-shrink: 0;
}
.infra__list { display: flex; flex-direction: column; }
.infra__item {
  display: grid; grid-template-columns: 36px 1fr auto;
  gap: 16px; align-items: baseline;
  padding: 18px 0;
  border-bottom: 1px solid var(--ieb-paper-line);
}
.infra__item:last-child { border-bottom: none; }
.infra__item-num {
  font-family: var(--font-mono);
  font-size: 11px; color: var(--ieb-gray-key);
  letter-spacing: .12em;
}
.infra__item-name {
  font-family: var(--font-display);
  font-size: 16px; font-weight: 500;
  color: var(--ieb-black);
  letter-spacing: -.005em;
}
.infra__item-meta {
  font-family: var(--font-mono);
  font-size: 11px; color: var(--ieb-gray-key);
  letter-spacing: .1em;
  text-transform: uppercase;
}

.infra__location {
  background: var(--ieb-black);
  color: #fff;
  padding: 56px;
  margin: 0 -56px;
  display: grid; grid-template-columns: 1fr 1.4fr;
  gap: 56px; align-items: center;
  border-top: 1px solid var(--ieb-ink-line);
}
.infra__location-eyebrow {
  font-family: var(--font-mono);
  font-size: 11px; color: var(--accent);
  letter-spacing: .2em; text-transform: uppercase;
  margin-bottom: 14px;
  display: flex; align-items: center; gap: 12px;
}
.infra__location-eyebrow::before {
  content: ""; width: 24px; height: 1px; background: var(--accent);
}
.infra__location h3 {
  font-family: var(--font-display);
  font-size: 32px; font-weight: 700;
  letter-spacing: -.02em; line-height: 1.1;
  margin-bottom: 12px;
  color: #fff;
}
.infra__location p {
  font-size: 14.5px; color: #888; line-height: 1.6;
}
.infra__map {
  position: relative;
  border: 1px solid var(--ieb-ink-line);
  background: var(--ieb-ink-08);
  height: 280px;
  overflow: hidden;
}
.infra__map svg { width: 100%; height: 100%; display: block; }
.infra__map-pin {
  position: absolute;
  top: 50%; left: 50%; transform: translate(-50%, -50%);
  display: flex; flex-direction: column; align-items: center;
  z-index: 2;
}
.infra__map-pin-dot {
  width: 14px; height: 14px;
  background: var(--accent);
  outline: 2px solid var(--ieb-black);
  outline-offset: 4px;
}
.infra__map-pin-label {
  margin-top: 14px;
  font-family: var(--font-mono);
  font-size: 10px; color: var(--accent);
  letter-spacing: .15em; text-transform: uppercase;
  font-weight: 700;
}

/* ============================================================
   RESPALDO GRUPO IEB
   ============================================================ */
.respaldo {
  background: var(--ieb-black);
  position: relative; overflow: hidden;
  border-top: 1px solid var(--ieb-ink-line);
}
.respaldo__bg {
  position: absolute; inset: 0;
  background-image: url('assets/tramas/trama-grid.svg');
  background-size: 600px;
  opacity: .12;
  filter: invert(1);
  pointer-events: none;
}
.respaldo__inner {
  position: relative; z-index: 2;
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 80px;
  align-items: center;
}
.respaldo__title {
  font-family: var(--font-display);
  font-size: clamp(36px, 4.6vw, 68px);
  font-weight: 700; line-height: 1.04;
  letter-spacing: -.025em;
  color: #fff;
  margin-bottom: 28px;
  text-wrap: balance;
}
.respaldo__title em { color: var(--accent); font-style: normal; }
.respaldo__lead {
  font-size: 16.5px; color: #999; line-height: 1.7;
  max-width: 520px;
  margin-bottom: 32px;
}
.respaldo__sig {
  display: flex; align-items: center; gap: 16px;
  padding-top: 20px;
  border-top: 1px solid var(--ieb-ink-line);
  font-family: var(--font-mono);
  font-size: 11px; color: var(--ieb-gray-key);
  letter-spacing: .15em; text-transform: uppercase;
}
.respaldo__sig img { height: 28px; }

.respaldo__stats {
  border: 1px solid var(--ieb-ink-line);
  background: rgba(0,0,0,0.4);
}
.respaldo__stat {
  display: grid; grid-template-columns: 60px 1fr auto;
  gap: 20px; align-items: baseline;
  padding: 28px 32px;
  border-bottom: 1px solid var(--ieb-ink-line);
}
.respaldo__stat:last-child { border-bottom: none; }
.respaldo__stat-num {
  font-family: var(--font-mono); font-size: 11px;
  color: var(--ieb-gray-key); letter-spacing: .1em;
}
.respaldo__stat-value {
  font-family: var(--font-display);
  font-size: clamp(28px, 3vw, 42px);
  font-weight: 700; line-height: 1;
  letter-spacing: -.025em;
  color: #fff;
}
.respaldo__stat-value em { color: var(--accent); font-style: normal; }
.respaldo__stat-value sup {
  font-size: 16px; vertical-align: super;
  font-weight: 500; color: var(--accent);
  margin-right: 4px;
}
.respaldo__stat-label {
  font-size: 13px; color: #888;
  line-height: 1.4; text-align: right;
  max-width: 180px;
}

/* ============================================================
   MODELO DE ACCESO
   ============================================================ */
.modelo {
  background: var(--ieb-paper);
  color: var(--fg-on-light-1);
  border-top: 1px solid var(--ieb-paper-line);
}
.modelo__inner {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 80px; align-items: start;
}
.modelo__title {
  font-family: var(--font-display);
  font-size: clamp(36px, 4.4vw, 64px);
  font-weight: 700; line-height: 1.04;
  letter-spacing: -.025em;
  color: var(--ieb-black);
  margin-bottom: 28px;
  text-wrap: balance;
}
.modelo__title em {

/* ============================================================

.faq {

  margin-top: 4px; flex-shrink: 0;

.form {
  background: rgba(0,0,0,0.4);
  border: 1px solid var(--ieb-ink-line);

}

}

.form__row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }

  color: #888; letter-spacing: .1em;

}

.form__field input,
.form__field select,
.form__field textarea {

  color: #fff;

}

.form__field textarea::placeholder { color: #444; }

}

  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path d='M1 1l5 5 5-5' stroke='%23FDE100' stroke-width='1.5' fill='none'/></svg>");
  background-repeat: no-repeat;
  background-position: right 4px center;
  padding-right: 24px;
}
.form__field select option { background: var(--ieb-black); color: #fff; }
.form__field textarea { resize: vertical; min-height: 80px; }
.form__check {

  font-size: 12.5px; color: #888; line-height: 1.5;
  margin: 8px 0 24px;

}
.form__check input { margin-top: 3px; accent-color: var(--accent); }
.form__check a { color: var(--accent); text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; }
.form__submit {

  background: var(--accent); color: #000;

.form__success h4 { font-size: 18px; color: #fff; font-weight: 700; letter-spacing: -.01em; }
.form__success p { font-size: 14px; color: #aaa; line-height: 1.6; }

   ============================================================ */
